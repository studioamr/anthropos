<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@300;400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/pages.css">
<title>Ideas · Anthropos Cities</title>
<meta name="description" content="Essays and the draft charter of Anthropos, the superintelligence republic.">
</head>
<body>
<section class="page-top"><div class="wrap">
  <div class="crumbs"><a href="index.html">Home</a><span>/</span><span>Ideas</span></div>
  <h1 class="h-xl mt-16">Ideas.</h1>
  <div class="c-list mt-40" id="list"></div>
</div></section>
<script type="module" src="js/site.js"></script>
<script type="module">
import { ESSAYS, DISPATCHES } from './js/content.js';
import { esc } from './js/site.js';
const items = [DISPATCHES[0], ...ESSAYS];
document.querySelector('#list').innerHTML = items.map(e => `<a href="article.html?a=${e.slug}"><div><div class="eyebrow">${esc(e.kicker || e.kind)}${e.n && e.n !== '—' ? ' ' + e.n : ''}</div><h2 class="mt-8">${esc(e.title)}</h2><p>${esc(e.dek)}</p></div><div class="img zoom"><img src="${e.cover}" alt="" loading="lazy"></div></a>`).join('');
</script>
</body>
</html>
