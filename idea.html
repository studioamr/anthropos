<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anthropos — Ideas</title>
<meta name="description" content="Writings from Anthropos, a self-sustaining city by NorthPoint Cities.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--g:clamp(16px,2vw,28px);--ink:#14161a;--paper:#f3f1ec;--line:rgba(20,22,26,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#071a33;color:#fff}
body{font:500 15px/1.4 "Inter Tight",Helvetica,Arial,sans-serif;letter-spacing:-.01em;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.bar{position:fixed;left:0;top:0;height:2px;background:#fff;z-index:50;width:0;mix-blend-mode:difference}
nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:var(--g);font-size:12px;mix-blend-mode:difference;color:#fff}
nav .b{font-weight:900;letter-spacing:-.03em}nav a:hover{opacity:.6}
/* hero */
.hero{position:relative;height:100svh;min-height:620px;overflow:hidden;display:flex;align-items:flex-end}
.hero img{position:absolute;inset:-6% 0;width:100%;height:112%;object-fit:cover;filter:grayscale(1) invert(1) contrast(.75) brightness(1.1) sepia(.3) hue-rotate(178deg) saturate(1.9);will-change:transform}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,26,51,.15) 0%,rgba(7,26,51,.1) 40%,rgba(7,26,51,.92) 100%)}
.hcap{position:relative;z-index:2;padding:0 var(--g) 9vh;max-width:1300px;margin:0 auto;width:100%}
.k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;display:flex;gap:12px;align-items:center;opacity:.85}.k:before{content:"";width:28px;height:1px;background:currentColor}
h1{font-size:clamp(52px,9vw,160px);font-weight:600;letter-spacing:-.06em;line-height:.9;margin:.25em 0 .25em;padding-bottom:.06em;background:linear-gradient(180deg,#fff 0%,#dfe2e8 55%,#9aa0ab 100%);-webkit-background-clip:text;color:transparent;max-width:14ch}
.dek{font-family:"EB Garamond",Georgia,serif;font-size:clamp(20px,2vw,28px);font-style:italic;max-width:36ch;opacity:.9}
.scroll{position:absolute;right:var(--g);bottom:9vh;z-index:2;font-size:11px;letter-spacing:.18em;display:flex;gap:8px;align-items:center}.scroll i{display:inline-block;animation:b 1.6s infinite;font-style:normal}@keyframes b{50%{transform:translateY(5px)}}
/* body */
.paper{background:var(--paper);color:var(--ink);position:relative}
.meta{max-width:1300px;margin:0 auto;padding:6vh var(--g) 0;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:18px}
.body{display:grid;grid-template-columns:1fr minmax(0,680px) 1fr;padding:9vh var(--g) 12vh}
.body>*{grid-column:2}
.body p{font-family:"EB Garamond",Georgia,serif;font-size:clamp(20px,1.55vw,23px);line-height:1.62;margin-bottom:1.05em;color:#23262b}
.body p:first-of-type:first-letter{float:left;font-family:"Inter Tight",sans-serif;font-weight:800;font-size:5.4em;line-height:.8;margin:.06em .1em 0 0;color:var(--ink)}
.body h3{font-size:clamp(24px,2.4vw,34px);font-weight:600;letter-spacing:-.035em;margin:1.6em 0 .6em;color:var(--ink)}
.body b{font-family:"Inter Tight",sans-serif;font-weight:700;font-size:.85em;letter-spacing:.02em}
.pull{grid-column:1/-1!important;text-align:center;font-size:clamp(30px,4vw,60px);font-weight:600;letter-spacing:-.045em;line-height:1.05;margin:7vh auto;max-width:20ch;color:var(--ink)}
.pull:before,.pull:after{content:"";display:block;width:60px;height:1px;background:var(--ink);margin:0 auto 3vh}.pull:after{margin:3vh auto 0}
.sig{font-size:11px!important;font-family:"Inter Tight",sans-serif!important;letter-spacing:.2em;text-transform:uppercase;color:#7a7d83!important;margin-top:6vh}
/* next */
.next{position:relative;height:70vh;min-height:460px;overflow:hidden;display:flex;align-items:flex-end;color:#fff}
.next img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) invert(1) contrast(.75) brightness(1.1) sepia(.3) hue-rotate(178deg) saturate(1.9);transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.next:hover img{transform:scale(1.05)}.next:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(7,26,51,.9))}
.next .in{position:relative;z-index:2;padding:0 var(--g) 8vh;max-width:1300px;margin:0 auto;width:100%}
.next h2{font-size:clamp(40px,6vw,100px);font-weight:600;letter-spacing:-.055em;line-height:.95;margin-top:.3em}
.more{background:var(--paper);color:var(--ink);padding:10vh var(--g)}
.more .in{max-width:1300px;margin:0 auto}.more .top{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.22em;margin-bottom:4vh}
.more .top a{border-bottom:1px solid var(--ink);padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.grid a span{display:block;aspect-ratio:16/10;overflow:hidden}
.grid img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) invert(1) contrast(.75) brightness(1.18) sepia(.3) hue-rotate(178deg) saturate(1.9);transition:transform 1.2s}
.grid a:hover img{transform:scale(1.05)}.grid b{display:block;margin-top:18px;font-weight:500;font-size:15px;letter-spacing:.2em;text-transform:uppercase}
footer{background:#071a33;padding:var(--g);display:flex;justify-content:space-between;font-size:11px;border-top:1px solid rgba(255,255,255,.15)}
.rv{opacity:0;transform:translateY(26px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
@media(max-width:760px){.grid{grid-template-columns:1fr}.meta{flex-direction:column;gap:6px}.scroll{display:none}}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<nav><a class="b" href="ascension.html">NORTHPOINT CITIES®</a><a href="ascension.html#articles">← Back to the city</a></nav>
<header class="hero"><img id="himg" alt=""><div class="hcap"><span class="k" id="hk"></span><h1 id="ht"></h1><p class="dek" id="hd"></p></div><span class="scroll">READ <i>↓</i></span></header>
<main class="paper"><div class="meta"><span id="mk"></span><span id="mr"></span><span>Anthropos · MMXXVI</span></div><article class="body" id="body"></article></main>
<a class="next" id="next"><img id="nimg" alt=""><div class="in"><span class="k">Next</span><h2 id="nt"></h2></div></a>
<section class="more"><div class="in"><div class="top"><span>MORE IDEAS</span><a href="ascension.html#articles">ALL CONTENT</a></div><div class="grid" id="grid"></div></div></section>
<footer><span>©2026 NorthPoint Cities</span><a href="ascension.html">Anthropos →</a></footer>
<script src="js/ideas-data.js"></script>
<script>
const slug=new URLSearchParams(location.search).get('a');let i=Math.max(0,ARTICLES.findIndex(a=>a.slug===slug));const A=ARTICLES[i];
document.title=A.t+' — Anthropos';
himg.src=nimg.src='';himg.src=`img/era/${IDEA_IMG[i]}.jpg`;hk.textContent=A.k+' · '+A.r;ht.textContent=A.t;hd.textContent=A.d;mk.textContent=A.k;mr.textContent=A.r+' read';
// body with a pull quote taken from the article's own first strong sentence
const tmp=document.createElement('div');tmp.innerHTML=A.b;const ps=[...tmp.children];const q=(A.d.split('. ')[0]||A.d).replace(/\.$/,'')+'.';
ps.forEach((el,k)=>{el.classList.add('rv');body.appendChild(el);if(k===Math.min(2,ps.length-2)){const p=document.createElement('div');p.className='pull rv';p.textContent=q;body.appendChild(p)}});
const sg=document.createElement('p');sg.className='sig rv';sg.textContent='Anthropos · NorthPoint Cities · MMXXVI';body.appendChild(sg);
const n=(i+1)%ARTICLES.length;next.href='idea.html?a='+ARTICLES[n].slug;nimg.src=`img/era/${IDEA_IMG[n]}.jpg`;nt.textContent=ARTICLES[n].t;
ARTICLES.map((a,k)=>[a,k]).filter(([,k])=>k!==i&&k!==n).slice(0,3).forEach(([a,k])=>{const e=document.createElement('a');e.href='idea.html?a='+a.slug;e.innerHTML=`<span><img src="img/era/${IDEA_IMG[k]}.jpg" alt="" loading="lazy"></span><b>${a.t}</b>`;grid.appendChild(e)});
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});document.querySelectorAll('.rv').forEach(e=>io.observe(e));
addEventListener('scroll',()=>{const h=document.documentElement;bar.style.width=(scrollY/(h.scrollHeight-innerHeight)*100)+'%';himg.style.transform=`translateY(${scrollY*.25}px) scale(1.05)`},{passive:true});
</script>
</body>
</html>
