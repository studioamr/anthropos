<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anthropos — Ideas</title>
<meta name="description" content="Writings from Anthropos, a self-sustaining city by NorthPoint Cities.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--g:clamp(16px,2vw,28px);--ink:#14161a;--paper:#f3f1ec;--line:rgba(20,22,26,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{font:500 15px/1.4 "Inter Tight",Helvetica,Arial,sans-serif;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
.bar{position:fixed;left:0;top:0;height:2px;background:var(--ink);z-index:50;width:0}
nav{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:18px var(--g);font-size:12px;background:rgba(243,241,236,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .b{font-weight:900;letter-spacing:-.03em}nav a:hover{opacity:.55}
.head{max-width:1200px;margin:0 auto;padding:16vh var(--g) 8vh;border-bottom:1px solid var(--line)}
.k{font-size:11px;letter-spacing:.22em;text-transform:uppercase;display:flex;gap:12px;align-items:center;color:#6c6f75}.k:before{content:"";width:28px;height:1px;background:currentColor}
h1{font-size:clamp(56px,10vw,170px);font-weight:600;letter-spacing:-.065em;line-height:.88;margin:.3em 0 .3em;max-width:12ch}
.dek{font-family:"EB Garamond",Georgia,serif;font-size:clamp(22px,2.3vw,32px);font-style:italic;max-width:34ch;color:#3a3d42;line-height:1.3}
.meta{display:flex;gap:32px;margin-top:6vh;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6c6f75}
.wrap{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,680px);gap:clamp(30px,6vw,110px);padding:10vh var(--g) 14vh}
.toc{position:sticky;top:90px;align-self:start;font-size:13px}.toc b{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#6c6f75;font-weight:500;margin-bottom:14px}
.toc a{display:block;padding:8px 0;border-top:1px solid var(--line);color:#6c6f75;transition:color .3s}.toc a.on,.toc a:hover{color:var(--ink)}
.body p{font-family:"EB Garamond",Georgia,serif;font-size:clamp(20px,1.5vw,22px);line-height:1.66;margin-bottom:1.05em;color:#23262b}
.body h3{font-size:clamp(24px,2.3vw,32px);font-weight:600;letter-spacing:-.035em;margin:2.2em 0 .7em;scroll-margin-top:90px}.body h3:first-child{margin-top:0}
.body h3+p{display:flow-root}.body h3+p:first-letter{float:left;font-family:"Inter Tight",sans-serif;font-weight:800;font-size:4.2em;line-height:.8;margin:.06em .1em 0 0}
.body i{font-style:italic}
.end{max-width:1200px;margin:0 auto;padding:0 var(--g) 14vh;display:flex;justify-content:space-between;align-items:flex-end;gap:30px;border-top:1px solid var(--line);padding-top:6vh}
.end small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#6c6f75;margin-bottom:10px}
.end .nx{font-size:clamp(28px,4vw,56px);font-weight:600;letter-spacing:-.05em;line-height:1;transition:opacity .3s}.end .nx:hover{opacity:.6}
.end .bk{font-size:13px;border-bottom:1px solid var(--ink);padding-bottom:4px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.toc{display:none}.end{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<nav><a class="b" href="ascension.html">NORTHPOINT CITIES®</a><a href="ascension.html#articles">← Back to the city</a></nav>
<header class="head"><span class="k" id="hk"></span><h1 id="ht"></h1><p class="dek" id="hd"></p><div class="meta"><span id="mr"></span><span>Anthropos · MMXXVI</span></div></header>
<div class="wrap"><aside class="toc" id="toc"><b>Contents</b></aside><article class="body" id="body"></article></div>
<div class="end"><a href="#" id="next"><small>Next essay</small><span class="nx" id="nt"></span></a><a class="bk" href="ascension.html#join">Join Anthropos →</a></div>
<script src="js/ideas-data.js"></script>
<script>
const slug = new URLSearchParams(location.search).get('a'); const i = Math.max(0, ARTICLES.findIndex((a) => a.slug === slug)); const A = ARTICLES[i];
document.title = A.t + ' — Anthropos'; hk.textContent = A.k; ht.textContent = A.t; hd.textContent = A.d; mr.textContent = A.r + ' read';
body.innerHTML = A.b;
const hs = [...body.querySelectorAll('h3')]; hs.forEach((h, k) => { h.id = 's' + k; const a = document.createElement('a'); a.href = '#s' + k; a.textContent = h.textContent; toc.appendChild(a); });
const n = (i + 1) % ARTICLES.length; next.href = 'idea.html?a=' + ARTICLES[n].slug; nt.textContent = ARTICLES[n].t + ' →';
const links = [...toc.querySelectorAll('a')];
addEventListener('scroll', () => { const d = document.documentElement; bar.style.width = (scrollY / (d.scrollHeight - innerHeight) * 100) + '%';
  let cur = 0; hs.forEach((h, k) => { if (h.getBoundingClientRect().top < 140) cur = k; }); links.forEach((l, k) => l.classList.toggle('on', k === cur)); }, { passive: true });
</script>
</body>
</html>
